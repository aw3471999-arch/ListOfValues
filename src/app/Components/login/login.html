<div class="min-h-screen flex items-center justify-center bg-slate-50 p-6">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 p-8">

        <div class="text-center mb-8">
            <div
                class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full mb-4">
                <i class="pi pi-lock text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Welcome Back</h1>
            <p class="text-slate-500">Login to manage your List of Values</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off" class="flex flex-col gap-5">

            <div class="flex flex-col gap-2">
                <label class="text-sm font-semibold text-slate-600">Username</label>
                <span class="p-input-icon-left">
                    <i class="pi pi-user"></i>
                    <input pInputText formControlName="username" autocomplete="new-password" class="w-full rounded-lg"
                        placeholder="Enter username" />
                </span>
            </div>

            <div class="flex flex-col gap-2">
                <label class="text-sm font-semibold text-slate-600">Password</label>
                <span class="p-input-icon-left">
                    <i class="pi pi-key"></i>
                    <p-password formControlName="password" [feedback]="false" [toggleMask]="true"
                        placeholder="Enter password" styleClass="w-full"
                        inputStyleClass="w-full rounded-lg border-slate-200 p-3" class="w-full">
                    </p-password>
                </span>
            </div>
            <p-button type="submit" label="Sign In" [loading]="loading()" [disabled]="loginForm.invalid"
                styleClass="w-full bg-emerald-500 border-none py-3 rounded-lg text-lg font-bold shadow-lg shadow-emerald-200 hover:bg-emerald-600 transition-all">
            </p-button>

        </form>
    </div>
</div>
