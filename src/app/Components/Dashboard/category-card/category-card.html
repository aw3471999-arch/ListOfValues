<div class="p-6 bg-slate-50 min-h-screen">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
        
        <div class="flex justify-between items-center mb-4">
            <p-button label="Logout" [rounded]="true"
                styleClass="bg-emerald-500 hover:bg-emerald-600 border-none px-6 py-2.5 shadow-md" (click)="onlogout()">
            </p-button>
        </div>

        <app-category-toolbar 
            (categorySelected)="onCategoryChange($event)"
            (categoriesLoaded)="onCategoriesLoaded($event)">
        </app-category-toolbar>

        <hr class="border-slate-100 mb-8 mt-4">

        <div class="p-4 bg-white rounded-xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <i class="pi pi-list text-indigo-600" style="font-size: 1.2rem"></i> 
                    List of Value
                </h3>
                
                <div class="flex gap-3">
                    <p-button 
                        label="Search" 
                        icon="pi pi-search" 
                        [outlined]="true"
                        severity="secondary"
                        styleClass="p-button-outlined text-indigo-600 border-indigo-600 hover:bg-indigo-50 px-5 py-2.5"
                        (click)="openSearch()">
                    </p-button>
                    
                    <p-button 
                        label="Add List Of Value" 
                        icon="pi pi-plus"
                        [rounded]="true"
                        styleClass="bg-emerald-500 hover:bg-emerald-600 border-none px-6 py-2.5 shadow-md"
                        (click)="openAdd()">
                    </p-button>
                </div>
            </div>

            <app-lov-table 
                [data]="listValues()" 
                [loading]="isLoading()"
                (onView)="openView($event)"
                (onDelete)="onDeleteItem($event)">
            </app-lov-table>
        </div>
    </div>
</div>

<app-lov-dialog 
    [(visible)]="isDialogVisible" 
    [mode]="currentMode()" 
    [item]="selectedDetailItem()"
    [categories]="toolbarCategories()" 
    [parents]="originalListValues()" 
    (onConfirm)="handleDialogAction($event)">
</app-lov-dialog>
