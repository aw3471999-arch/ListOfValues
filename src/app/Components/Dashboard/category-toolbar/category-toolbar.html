<div class="mb-4">
  <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2 mb-4">
    <i class="pi pi-users text-indigo-600"></i> Select Category
  </h2>

  <div class="flex items-center gap-4 bg-white p-2 rounded-2xl border border-slate-100 shadow-sm">
    
    <div class="flex items-center">
      @if (!isSearchOpen()) {
        <p-button 
          icon="pi pi-search" 
          [rounded]="true" 
          [text]="true"
          (click)="toggleSearch()"
          styleClass="bg-slate-100 text-slate-500 hover:bg-slate-200 w-10 h-10 flex items-center justify-center p-0 transition">
        </p-button>
      } @else {
        <div class="relative flex items-center animate-fade-in">
          <input 
            type="text" 
            pInputText 
            placeholder="Search category..." 
            [(ngModel)]="searchTerm"
            (input)="onSearchInput($event)"
            class="pl-4 pr-10 py-2 w-64 rounded-full border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 transition-all text-sm"
            #searchInput
          />
          <i 
            class="pi pi-times absolute right-3 text-slate-400 hover:text-red-500 cursor-pointer text-xs"
            (click)="toggleSearch()">
          </i>
        </div>
      }
    </div>

    <div class="flex gap-3 overflow-x-auto pb-1 no-scrollbar items-center">
      @if (isLoading()) {
        <div class="text-sm text-slate-400 italic py-2">Loading...</div>
      }

      @for (cat of filteredCategories(); track cat.lovTypeId) {
        <p-button 
          [label]="cat.title" 
          [outlined]="selectedCategory()?.lovTypeId !== cat.lovTypeId"
          (click)="selectCategory(cat)"
          styleClass="font-medium whitespace-nowrap rounded-lg px-4 transition h-9"
          [ngClass]="selectedCategory()?.lovTypeId === cat.lovTypeId ? 'bg-indigo-600 text-white border-indigo-600' : 'border-indigo-100 text-indigo-600 hover:bg-indigo-50'">
        </p-button>
      }
    </div>
  </div>
</div>
